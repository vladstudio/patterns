<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pattern generator — free seamless SVG patterns from your own shapes</title>
  <meta name="description" content="Free online pattern generator. Pack squiggles, dots, spirals or your own SVG shapes into dense, non-overlapping patterns and seamless tiles. Download as SVG.">
  <link rel="canonical" href="https://vladstudio.github.io/patterns/">
  <meta name="theme-color" content="#1d1d1f">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vladstudio.github.io/patterns/">
  <meta property="og:title" content="Pattern generator">
  <meta property="og:description" content="Pack squiggles, dots, spirals or your own SVG shapes into dense, non-overlapping patterns and seamless tiles. Free, in your browser.">
  <meta property="og:image" content="https://vladstudio.github.io/patterns/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Pattern generator",
      "url": "https://vladstudio.github.io/patterns/",
      "description": "Pack SVG shapes into dense, non-overlapping patterns and seamless tiles. Download as SVG.",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0" },
      "author": { "@type": "Person", "name": "Vlad Gerasimov" }
    }
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <h1>Pattern generator</h1>

    <section>
      <h2>Shapes</h2>
      <select id="folder"></select>
      <p id="folderNote" class="msg err"></p>
      <div id="shapeList" class="shapes"></div>
    </section>

    <section>
      <h2>Colors</h2>
      <div class="colors">
        <label>From <span class="row"><input type="color" data-for="colorFrom"><input id="colorFrom" spellcheck="false"></span></label>
        <label>To <span class="row"><input type="color" data-for="colorTo"><input id="colorTo" spellcheck="false"></span></label>
        <label>Count <input id="colorCount" type="number" min="1" step="1"></label>
      </div>
      <div id="swatches" class="swatches"></div>
    </section>

    <section>
      <h2>Canvas</h2>
      <div class="grid2">
        <label>Width <input id="width" type="number" min="10" max="10000" step="10"></label>
        <label>Height <input id="height" type="number" min="10" max="10000" step="10"></label>
      </div>
      <div class="grid2">
        <label>Background
          <span class="row"><input id="background" type="color"><label class="check"><input id="transparent" type="checkbox"> None</label></span>
        </label>
        <label>Edges
          <select id="edge">
            <option value="clip">Bleed &amp; clip</option>
            <option value="inside">Keep inside</option>
            <option value="tile">Seamless tile</option>
          </select>
        </label>
      </div>
    </section>

    <div id="sliders"></div>

    <section>
      <h2>Randomness</h2>
      <div class="row">
        <label class="grow">Seed <input id="seed" spellcheck="false"></label>
        <button id="reseed" title="New random seed">New seed</button>
      </div>
      <label class="check"><input id="auto" type="checkbox"> Regenerate on every change</label>
      <button id="lucky" class="wide" title="Random values for every setting">I feel lucky</button>
    </section>

    <section class="actions main-actions">
      <button id="generate" class="primary">Generate</button>
      <button id="download">Download SVG</button>
    </section>
    <section class="actions">
      <button id="importSettings">Import settings…</button>
      <button id="exportSettings">Export settings</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </section>
  </aside>

  <main id="stage">
    <div id="viewport"><div id="frame"></div></div>
    <div id="pending">
      <div class="bar"><span id="progress"></span></div>
      <div class="label" id="progressLabel"></div>
    </div>
    <div id="status"></div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
